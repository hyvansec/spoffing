<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Instagram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#fff;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
h1{font-size:32px;background:linear-gradient(135deg,#405DE6,#5851DB,#833AB4,#C13584,#E1306C,#FD1D1D);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
p{color:#8e8e8e;font-size:14px;margin-bottom:20px}
.btn{background:#0095f6;color:#fff;border:none;padding:14px 40px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:0.2s}
.btn:active{transform:scale(0.96)}
</style>
</head>
<body>
<h1>Instagram</h1>
<p>Klik tombol di bawah untuk melanjutkan</p>
<button class="btn" id="go">Lanjutkan</button>

<script>
document.getElementById('go').onclick = function() {
    const win = window.open('about:blank', '_blank');
    if (!win) return alert('Izinkan popup!');
    
    win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Instagram</title>
            <style>
                *{margin:0;padding:0;box-sizing:border-box}
                body{background:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;flex-direction:column;text-align:center;padding:20px}
                h1{font-size:32px;background:linear-gradient(135deg,#405DE6,#5851DB,#833AB4,#C13584,#E1306C,#FD1D1D);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
                p{color:#8e8e8e;font-size:14px;margin-top:10px}
                .spin{width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #0095f6;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
                @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360)}}
            </style>
        </head>
        <body>
            <h1>Instagram</h1>
            <div class="spin"></div>
            <p>Mengarahkan ke halaman login...</p>
            <script>
                // ==========================================
                // SPOOF ADDRESS BAR — LANGSUNG JADI
                // ==========================================
                history.replaceState(null, 'Instagram', 'https://www.instagram.com/accounts/login/');
                
                setInterval(() => {
                    if (location.href !== 'https://www.instagram.com/accounts/login/') {
                        history.replaceState(null, 'Instagram', 'https://www.instagram.com/accounts/login/');
                    }
                }, 100);
                
                window.addEventListener('popstate', () => {
                    history.replaceState(null, 'Instagram', 'https://www.instagram.com/accounts/login/');
                });
                
                // Redirect ke Instagram asli setelah 2 detik
                setTimeout(() => {
                    location.href = 'https://www.instagram.com/accounts/login/';
                }, 2000);
            <\/script>
        </body>
        </html>
    `);
    win.document.close();
};
</script>
</body>
</html>
